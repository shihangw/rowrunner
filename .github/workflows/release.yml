name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rowrunner-release
  cancel-in-progress: false

jobs:
  version:
    name: Prepare version pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: node -e "if (require('./package.json').version !== process.env.EXPECTED_VERSION) process.exit(1)"
      - name: Check, build example, and validate npm package
        run: |
          npm run check
          npm run build:example
          npm run check:package
      - name: Publish package
        run: npm publish --access public
