name: Canary Candidate

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    name: Tag merged pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find the pull request merged by this push
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            pull_request_number="$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
                jq -r --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .number] | if length == 1 then .[0] else empty end'
            )"
            if [[ -n "$pull_request_number" ]]; then
              echo "number=$pull_request_number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "No merged pull request matched this main-branch commit."
      - name: Create candidate tag
        if: steps.pull_request.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.pull_request.outputs.number }}
        run: |
          tag="canary-pr-$PULL_REQUEST_NUMBER-${GITHUB_SHA:0:12}"
          if existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing_sha" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          echo "Canary candidate: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
